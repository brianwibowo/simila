services:
  app:
    container_name: simila-app
    image: ghcr.io/brianwibowo/simila:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8086:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8086
      - RUN_MIGRATIONS=true
    env_file:
      - .env
    volumes:
      - simila-storage:/var/www/html/storage/app/public
    networks:
      - simila-network
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: simila-db
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-similaPass123}
      MYSQL_DATABASE: ${DB_DATABASE:-simila}
    volumes:
      - simila-dbdata:/var/lib/mysql
    networks:
      - simila-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-similaPass123}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  simila-storage:
    name: simila_storage
  simila-dbdata:
    name: simila_dbdata

networks:
  simila-network:
    name: simila_network
