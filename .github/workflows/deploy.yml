name: Build and Deploy SIMILA to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🔐 Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Create deploy folder if not exists
            mkdir -p ~/simila
            cd ~/simila

            # Create or update docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              app:
                container_name: simila-app
                image: ghcr.io/${{ env.IMAGE_NAME }}:latest
                restart: unless-stopped
                ports:
                  - "8086:80"
                environment:
                  - APP_ENV=production
                  - APP_DEBUG=false
                  - APP_URL=https://simila.my.id
                  - RUN_MIGRATIONS=true
                env_file:
                  - .env
                volumes:
                  - simila_storage:/var/www/html/storage/app/public
                networks:
                  - simila_network

            volumes:
              simila_storage:
                name: simila_storage

            networks:
              simila_network:
                name: simila_network
            EOF

            # Pull latest image
            echo "📥 Pulling latest image..."
            docker compose pull app || docker-compose pull app

            # Restart container
            echo "🚀 Starting updated container..."
            docker compose up -d --remove-orphans || docker-compose up -d --remove-orphans

            echo "✅ Deployment completed successfully for simila.my.id!"
